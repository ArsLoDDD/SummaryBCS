name: Windows EXE — збірка

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - name: Перевірити Windows-скрипт підпису
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "src-tauri/sign-windows.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "Windows-скрипт підпису містить синтаксичні помилки."
          }
      - name: Перевірити всі робочі версії
        run: npm run test:ci

  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINDOWS_TIMESTAMP_URL: http://timestamp.digicert.com
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Summary
            compile_command: npm run tauri -- build --no-bundle --no-sign
            bundle_command: npm run tauri -- bundle --bundles nsis --no-sign --no-binary-patching
            artifact_name: BCS-Windows-Summary
            binary_name: SummaryBCS
          - app: Editor
            compile_command: npm run tauri -- build --config src-tauri/tauri.editor.conf.json --no-bundle --no-sign
            bundle_command: npm run tauri -- bundle --config src-tauri/tauri.editor.conf.json --bundles nsis --no-sign --no-binary-patching
            artifact_name: BCS-Windows-Editor
            binary_name: BCSEditor
          - app: Strips
            compile_command: npm run tauri -- build --config src-tauri/tauri.strips.conf.json --no-bundle --no-sign
            bundle_command: npm run tauri -- bundle --config src-tauri/tauri.strips.conf.json --bundles nsis --no-sign --no-binary-patching
            artifact_name: BCS-Windows-Strips
            binary_name: StripsEditor
          - app: Strips Registry
            compile_command: npm run tauri -- build --config src-tauri/tauri.strips-registry.conf.json --no-bundle --no-sign
            bundle_command: npm run tauri -- bundle --config src-tauri/tauri.strips-registry.conf.json --bundles nsis --no-sign --no-binary-patching
            artifact_name: BCS-Windows-Strips-Registry
            binary_name: StripsRegistry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Підготувати сертифікат підпису
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificateDirectory = Join-Path $env:RUNNER_TEMP "summarybcs-code-signing"
          $certificatePath = Join-Path $certificateDirectory "code-signing.pfx"
          $publicCertificatePath = Join-Path $certificateDirectory "SummaryBCS-Code-Signing.cer"
          New-Item -ItemType Directory -Path $certificateDirectory -Force | Out-Null

          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
            throw "WINDOWS_CERTIFICATE і WINDOWS_CERTIFICATE_PASSWORD мають бути задані разом."
          }

          if ($hasCertificate) {
            $base64 = $env:WINDOWS_CERTIFICATE `
              -replace "-----BEGIN [^-]+-----", "" `
              -replace "-----END [^-]+-----", "" `
              -replace "\s", ""
            try {
              [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($base64))
            } catch {
              throw "WINDOWS_CERTIFICATE не є коректним Base64-вмістом PFX."
            }
            $certificatePassword = $env:WINDOWS_CERTIFICATE_PASSWORD
            $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $certificatePath,
              $certificatePassword,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            )
            $signingMode = "trusted"
          } else {
            $certificatePassword = [guid]::NewGuid().ToString("N")
            $securePassword = ConvertTo-SecureString -String $certificatePassword -AsPlainText -Force
            $certificate = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=SummaryBCS Local Code Signing" `
              -FriendlyName "SummaryBCS Local Code Signing" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -KeyAlgorithm RSA `
              -KeyLength 3072 `
              -HashAlgorithm SHA256 `
              -KeyExportPolicy Exportable `
              -KeySpec Signature `
              -NotAfter (Get-Date).AddYears(3)
            Export-PfxCertificate -Cert $certificate -FilePath $certificatePath -Password $securePassword | Out-Null
            $signingMode = "self-signed"
            Write-Warning "PFX secrets are absent. A self-signed Code Signing certificate was generated."
          }

          if (-not $certificate.HasPrivateKey) {
            throw "PFX не містить приватного ключа."
          }
          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          $enhancedKeyUsage = $certificate.Extensions |
            Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } |
            ForEach-Object { $_.EnhancedKeyUsages } |
            Where-Object { $_.Value -eq $codeSigningOid }
          if ($null -eq $enhancedKeyUsage) {
            throw "Сертифікат не призначений для Windows Code Signing."
          }
          $now = Get-Date
          if ($now -lt $certificate.NotBefore -or $now -gt $certificate.NotAfter) {
            throw "Сертифікат ще не чинний або вже прострочений."
          }
          Export-Certificate -Cert $certificate -FilePath $publicCertificatePath -Type CERT | Out-Null
          "WINDOWS_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_CERTIFICATE_PASSWORD=$certificatePassword" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_SIGNING_PUBLIC_CERTIFICATE=$publicCertificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_SIGNING_MODE=$signingMode" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Сертифікат перевірено: $($certificate.Subject)"
          Write-Host "Відбиток: $($certificate.Thumbprint)"
          Write-Host "Чинний до: $($certificate.NotAfter.ToString('u'))"
          Write-Host "Режим підпису: $signingMode"
      - name: Перевірити підпис до основної збірки
        shell: pwsh
        run: |
          $probeDirectory = Join-Path $env:RUNNER_TEMP "summarybcs-signing-probe"
          $probePath = Join-Path $probeDirectory "signing-probe.exe"
          $signingScript = (Resolve-Path "src-tauri/sign-windows.ps1").Path
          New-Item -ItemType Directory -Path $probeDirectory -Force | Out-Null
          rustc "scripts/signing-probe.rs" -o $probePath
          if ($LASTEXITCODE -ne 0) {
            throw "Не вдалося створити тестовий EXE для перевірки підпису."
          }

          & powershell.exe `
            -NoLogo `
            -NoProfile `
            -NonInteractive `
            -ExecutionPolicy Bypass `
            -File $signingScript `
            $probePath
          if ($LASTEXITCODE -ne 0) {
            throw "Попередня перевірка Windows-підпису завершилася помилкою."
          }
          Write-Host "Попередня перевірка підпису успішна. Основну збірку можна починати."
          Remove-Item -LiteralPath $probeDirectory -Recurse -Force
      - name: Зібрати програму ${{ matrix.app }}
        run: ${{ matrix.compile_command }}
      - name: Підписати програму ${{ matrix.app }}
        shell: pwsh
        run: |
          $application = (Resolve-Path "src-tauri/target/release/${{ matrix.binary_name }}.exe").Path
          $signingScript = (Resolve-Path "src-tauri/sign-windows.ps1").Path
          & powershell.exe `
            -NoLogo `
            -NoProfile `
            -NonInteractive `
            -ExecutionPolicy Bypass `
            -File $signingScript `
            $application
          if ($LASTEXITCODE -ne 0) {
            throw "Не вдалося підписати файл програми: $application"
          }
      - name: Створити інсталятор ${{ matrix.app }}
        run: ${{ matrix.bundle_command }}
      - name: Підписати інсталятор і підготувати EXE
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Очікувався рівно один NSIS EXE, знайдено: $($installers.Count)"
          }
          $application = Get-Item "src-tauri/target/release/${{ matrix.binary_name }}.exe"
          $signingScript = (Resolve-Path "src-tauri/sign-windows.ps1").Path
          & powershell.exe `
            -NoLogo `
            -NoProfile `
            -NonInteractive `
            -ExecutionPolicy Bypass `
            -File $signingScript `
            $installers[0].FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Не вдалося підписати інсталятор: $($installers[0].FullName)"
          }
          $signedFiles = @($application, $installers[0])
          $expectedCertificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $env:WINDOWS_SIGNING_PUBLIC_CERTIFICATE
          )
          $thumbprints = @()
          foreach ($file in $signedFiles) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            $selfSignedStatusAllowed = $env:WINDOWS_SIGNING_MODE -eq "self-signed" -and ($signature.Status.ToString() -in @("NotTrusted", "UnknownError"))
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -and -not $selfSignedStatusAllowed) {
              throw "Некоректний Authenticode-підпис $($file.Name): $($signature.Status) — $($signature.StatusMessage)"
            }
            if ($null -eq $signature.SignerCertificate) {
              throw "У файлі відсутній сертифікат підписувача: $($file.Name)"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $expectedCertificate.Thumbprint) {
              throw "Файл підписаний не підготовленим сертифікатом: $($file.Name)"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Файл не має мітки часу: $($file.Name)"
            }
            $thumbprints += $signature.SignerCertificate.Thumbprint
            Write-Host "Підпис підтверджено: $($file.Name) — $($signature.SignerCertificate.Subject)"
          }
          if (@($thumbprints | Select-Object -Unique).Count -ne 1) {
            throw "Програма та інсталятор підписані різними сертифікатами."
          }
          New-Item -ItemType Directory -Path "windows-artifact" -Force | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination "windows-artifact/$($installers[0].Name)"
          Copy-Item -LiteralPath $env:WINDOWS_SIGNING_PUBLIC_CERTIFICATE -Destination "windows-artifact/SummaryBCS-Code-Signing.cer"
          Copy-Item -LiteralPath "docs/INSTALL-CERTIFICATE.txt" -Destination "windows-artifact/INSTALL-CERTIFICATE.txt"
          Set-Content -LiteralPath "windows-artifact/SIGNING-INFO.txt" -Encoding utf8 -Value @(
            "Signing mode: $env:WINDOWS_SIGNING_MODE"
            "Certificate subject: $($signature.SignerCertificate.Subject)"
            "Certificate thumbprint: $($signature.SignerCertificate.Thumbprint)"
            "Certificate valid until: $($signature.SignerCertificate.NotAfter.ToString('u'))"
          )
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: windows-artifact/*
          if-no-files-found: error
          retention-days: 14
      - name: Видалити тимчасовий PFX
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath "${{ runner.temp }}\summarybcs-code-signing" -Recurse -Force -ErrorAction SilentlyContinue
