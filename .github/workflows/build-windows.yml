name: Windows EXE — збірка

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - name: Перевірити всі робочі версії
        run: npm run test:ci

  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Summary
            build_command: npm run tauri:build:summary
            artifact_name: BCS-Windows-Summary
          - app: Editor
            build_command: npm run tauri:build:editor
            artifact_name: BCS-Windows-Editor
          - app: Strips
            build_command: npm run tauri:build:strips
            artifact_name: BCS-Windows-Strips
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Зібрати ${{ matrix.app }}
        run: ${{ matrix.build_command }}
      - name: Підготувати EXE
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Очікувався рівно один NSIS EXE, знайдено: $($installers.Count)"
          }
          New-Item -ItemType Directory -Path "windows-artifact" -Force | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination "windows-artifact/$($installers[0].Name)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: windows-artifact/*.exe
          if-no-files-found: error
          retention-days: 14
